version: '3.8'

services:
  # 1. Base de datos de Grafos (Neo4j)
  neo4j:
    image: neo4j:5.15.0
    container_name: brain-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-openclaw123}
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474" # Interfaz web
      - "7687:7687" # Puerto Bolt (conexión DB)
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # 2. Caché de alta velocidad (Redis)
  redis:
    image: redis:7.2-alpine
    container_name: brain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 3. Silhouette Brain API & Cognitive Engines
  brain-api:
    build: .
    container_name: brain-api
    ports:
      - "9876:9876" # Puerto de la API
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-openclaw123}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
    depends_on:
      - neo4j
      - redis
    restart: unless-stopped

volumes:
  neo4j_data:
  redis_data: