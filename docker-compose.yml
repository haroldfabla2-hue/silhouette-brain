# Silhouette Brain — full stack.
#
# Secrets are read from the environment / a .env file (see .env.example).
# The API and the cognitive daemon share the same code image and the same
# /data volume; Neo4j (deep memory) and Redis (working memory) are optional but
# enabled here for the full experience.

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: brain-neo4j
    environment:
      - NEO4J_AUTH=${SILHOUETTE_NEO4J_USER:-neo4j}/${SILHOUETTE_NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: brain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build: .
    container_name: brain-api
    command: ["silhouette", "serve"]
    ports:
      - "9876:9876"
    environment:
      - SILHOUETTE_API_HOST=0.0.0.0
      - SILHOUETTE_DATA_DIR=/data
      - SILHOUETTE_NEO4J_URI=bolt://neo4j:7687
      - SILHOUETTE_NEO4J_USER=${SILHOUETTE_NEO4J_USER:-neo4j}
      - SILHOUETTE_NEO4J_PASSWORD=${SILHOUETTE_NEO4J_PASSWORD:-changeme}
      - SILHOUETTE_REDIS_URL=redis://redis:6379
      - SILHOUETTE_REASONING_PROVIDER=${SILHOUETTE_REASONING_PROVIDER:-none}
      - SILHOUETTE_REASONING_API_KEY=${SILHOUETTE_REASONING_API_KEY:-}
      - SILHOUETTE_REASONING_MODEL=${SILHOUETTE_REASONING_MODEL:-gpt-4o-mini}
    volumes:
      - brain_data:/data
    depends_on:
      - neo4j
      - redis
    restart: unless-stopped

  daemon:
    build: .
    container_name: brain-daemon
    command: ["silhouette", "daemon"]
    environment:
      - SILHOUETTE_DATA_DIR=/data
      - SILHOUETTE_NEO4J_URI=bolt://neo4j:7687
      - SILHOUETTE_NEO4J_USER=${SILHOUETTE_NEO4J_USER:-neo4j}
      - SILHOUETTE_NEO4J_PASSWORD=${SILHOUETTE_NEO4J_PASSWORD:-changeme}
      - SILHOUETTE_REDIS_URL=redis://redis:6379
      - SILHOUETTE_REASONING_PROVIDER=${SILHOUETTE_REASONING_PROVIDER:-none}
      - SILHOUETTE_REASONING_API_KEY=${SILHOUETTE_REASONING_API_KEY:-}
    volumes:
      - brain_data:/data
    depends_on:
      - neo4j
      - redis
    restart: unless-stopped

volumes:
  neo4j_data:
  redis_data:
  brain_data:
