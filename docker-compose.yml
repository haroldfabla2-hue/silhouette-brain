version: '3.8'

services:
  # 1. Base de datos de Grafos (Neo4j)
  neo4j:
    image: neo4j:5.15.0
    container_name: brain-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474" # Interfaz web
      - "7687:7687" # Puerto Bolt (conexión DB)
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # 2. Caché de alta velocidad (Redis)
  redis:
    image: redis:7.2-alpine
    container_name: brain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 3. Silhouette Brain API & Cognitive Engines
  brain-api:
    build: .
    container_name: brain-api
    ports:
      - "9876:9876" # Puerto de la API
    environment:
      # Inside the container we must bind to all interfaces so the published
      # port (9876) is reachable. Host isolation is handled by Docker.
      - BRAIN_API_HOST=0.0.0.0
      # Reasoning provider (used by the cognitive/synthesis layer)
      - REASONING_PROVIDER=${REASONING_PROVIDER:-minimax}
      - REASONING_API_KEY=${REASONING_API_KEY}
      - REASONING_MODEL=${REASONING_MODEL:-MiniMax-M2.5}
      # Local embeddings (no API key required)
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      # Inside the compose network Neo4j is reachable as neo4j:7687 (bolt)
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
    depends_on:
      - neo4j
      - redis
    restart: unless-stopped

volumes:
  neo4j_data:
  redis_data: