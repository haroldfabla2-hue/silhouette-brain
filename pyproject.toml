[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silhouette-brain"
version = "1.0.0-alpha"
description = "4-Tier Cognitive Memory System for AI Agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alberto Farah Blair", email = "alberto.farah.b@gmail.com"}
]
keywords = ["ai", "memory", "agents", "cognitive", "llm", "vector-search", "graph", "neo4j"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.14.1",
    "redis>=5.0.1",
    "openai>=1.12.0",
    "numpy>=1.26.4",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
fastembed = ["fastembed"]
dev = ["pytest", "flake8", "black"]

[project.urls]
Homepage = "https://github.com/haroldfabla2-hue/silhouette-brain"
Documentation = "https://github.com/haroldfabla2-hue/silhouette-brain#readme"
Repository = "https://github.com/haroldfabla2-hue/silhouette-brain"
Issues = "https://github.com/haroldfabla2-hue/silhouette-brain/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*"]
exclude = ["tests*"]
